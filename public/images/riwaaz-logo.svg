<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Band -->
  <circle cx="50" cy="54" r="32" stroke="url(#goldGrad)" stroke-width="4.5" fill="none" filter="url(#glow)"/>
  
  <!-- Inner Ring Shadow -->
  <circle cx="50" cy="54" r="26" stroke="#111" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Diamond Crown Top -->
  <path d="M50 14 L62 26 L50 32 L38 26 Z" fill="url(#goldGrad)"/>
  <path d="M50 14 L56 26 L50 32 L44 26 Z" fill="#FFF8E7" opacity="0.8"/>
  <line x1="50" y1="14" x2="50" y2="32" stroke="#D4AF37" stroke-width="1"/>

  <!-- Diamond Facet Sparkles -->
  <circle cx="50" cy="14" r="2.5" fill="#FFFFFF"/>
  <path d="M50 6 L52 11 L57 13 L52 15 L50 20 L48 15 L43 13 L48 11 Z" fill="#FFE082"/>

  <!-- Center 'R' Initial -->
  <text x="50" y="62" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="bold" font-size="20" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="middle">R</text>
</svg>
